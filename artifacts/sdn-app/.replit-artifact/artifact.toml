kind = "web"
previewPath = "/"
title = "SDN — Gestão Interna"
version = "1.0.0"
id = "artifacts/sdn-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20502

[services.development]
run = "pnpm --filter @workspace/sdn-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sdn-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/sdn-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20502"
BASE_PATH = "/"
