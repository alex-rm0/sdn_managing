components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── Auth ────────────────────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthUser:
      type: object
      required: [id, name, email, role, active]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, trainer]
        active:
          type: boolean
        assignedCategories:
          type: array
          items:
            type: string

    # ── Users ───────────────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, name, email, role, active, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, trainer]
        active:
          type: boolean
        assignedCategories:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    UserInput:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [admin, trainer]
        assignedCategories:
          type: array
          items:
            type: string

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: ["string", "null"]
        role:
          type: string
          enum: [admin, trainer]
        active:
          type: boolean
        assignedCategories:
          type: array
          items:
            type: string

    # ── Seasons ─────────────────────────────────────────────────────────────────
    Season:
      type: object
      required: [id, name, startDate, endDate, active]
      properties:
        id:
          type: integer
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        active:
          type: boolean

    SeasonInput:
      type: object
      required: [name, startDate, endDate]
      properties:
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        active:
          type: boolean

    SeasonUpdate:
      type: object
      properties:
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        active:
          type: boolean

    # ── Category Rules ──────────────────────────────────────────────────────────
    CategoryRule:
      type: object
      required: [id, name, minAge, maxAge]
      properties:
        id:
          type: integer
        name:
          type: string
        minAge:
          type: integer
        maxAge:
          type: ["integer", "null"]
        description:
          type: ["string", "null"]

    CategoryRuleInput:
      type: object
      required: [name, minAge]
      properties:
        name:
          type: string
        minAge:
          type: integer
        maxAge:
          type: ["integer", "null"]
        description:
          type: ["string", "null"]

    # ── Athletes ────────────────────────────────────────────────────────────────
    Athlete:
      type: object
      required: [id, name, birthDate, gender, status, memberNumber, affiliationDate]
      properties:
        id:
          type: integer
        name:
          type: string
        birthDate:
          type: string
          format: date
        gender:
          type: string
          enum: [M, F]
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        memberNumber:
          type: ["string", "null"]
        fprNumber:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        affiliationDate:
          type: string
          format: date
        status:
          type: string
          enum: [ativo, inativo, suspenso]
        notes:
          type: ["string", "null"]
        categoryOverride:
          type: ["string", "null"]

    AthleteDetail:
      type: object
      required: [id, name, birthDate, gender, status, memberNumber, affiliationDate]
      properties:
        id:
          type: integer
        name:
          type: string
        birthDate:
          type: string
          format: date
        gender:
          type: string
          enum: [M, F]
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        memberNumber:
          type: ["string", "null"]
        fprNumber:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        affiliationDate:
          type: string
          format: date
        status:
          type: string
          enum: [ativo, inativo, suspenso]
        notes:
          type: ["string", "null"]
        categoryOverride:
          type: ["string", "null"]
        resultHistory:
          type: array
          items:
            $ref: "#/components/schemas/Result"
        quotaSummary:
          $ref: "#/components/schemas/AthleteQuotaSummary"

    AthleteInput:
      type: object
      required: [name, birthDate, gender, status, affiliationDate]
      properties:
        name:
          type: string
        birthDate:
          type: string
          format: date
        gender:
          type: string
          enum: [M, F]
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        memberNumber:
          type: ["string", "null"]
        fprNumber:
          type: ["string", "null"]
        affiliationDate:
          type: string
          format: date
        status:
          type: string
          enum: [ativo, inativo, suspenso]
        notes:
          type: ["string", "null"]

    AthleteUpdate:
      type: object
      properties:
        name:
          type: string
        birthDate:
          type: string
          format: date
        gender:
          type: string
          enum: [M, F]
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        memberNumber:
          type: ["string", "null"]
        fprNumber:
          type: ["string", "null"]
        affiliationDate:
          type: string
          format: date
        status:
          type: string
          enum: [ativo, inativo, suspenso]
        notes:
          type: ["string", "null"]

    CategoryOverrideInput:
      type: object
      required: [seasonId]
      properties:
        seasonId:
          type: integer
        categoryOverride:
          type: ["string", "null"]

    CrewHistoryItem:
      type: object
      required: [crewId, crewName, seasonId, seasonName, boatClass]
      properties:
        crewId:
          type: integer
        crewName:
          type: string
        seasonId:
          type: integer
        seasonName:
          type: string
        boatClass:
          type: string

    # ── Crews ───────────────────────────────────────────────────────────────────
    Crew:
      type: object
      required: [id, name, boatClass, category, seasonId]
      properties:
        id:
          type: integer
        name:
          type: string
        boatClass:
          type: string
          enum: ["1x", "2x", "2-", "4x", "4-", "4+", "8+"]
        category:
          type: string
        seasonId:
          type: integer
        seasonName:
          type: string
        athleteIds:
          type: array
          items:
            type: integer
        athletes:
          type: array
          items:
            $ref: "#/components/schemas/Athlete"

    CrewInput:
      type: object
      required: [name, boatClass, category, seasonId]
      properties:
        name:
          type: string
        boatClass:
          type: string
          enum: ["1x", "2x", "2-", "4x", "4-", "4+", "8+"]
        category:
          type: string
        seasonId:
          type: integer
        athleteIds:
          type: array
          items:
            type: integer

    CrewUpdate:
      type: object
      properties:
        name:
          type: string
        boatClass:
          type: string
          enum: ["1x", "2x", "2-", "4x", "4-", "4+", "8+"]
        category:
          type: string
        seasonId:
          type: integer
        athleteIds:
          type: array
          items:
            type: integer

    # ── Fleet ───────────────────────────────────────────────────────────────────
    FleetItem:
      type: object
      required: [id, identifier, type, status]
      properties:
        id:
