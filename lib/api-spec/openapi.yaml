  # ── Training Sessions ─────────────────────────────────────────────────────────
  /training-sessions:
    get:
      operationId: listTrainingSessions
      tags: [trainingSessions]
      parameters:
        - name: seasonId
          in: query
          schema:
            type: integer
        - name: groupCategory
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
        - name: trainerId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Training sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainingSession"
    post:
      operationId: createTrainingSession
