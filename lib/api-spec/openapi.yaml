  # ── Attendance ────────────────────────────────────────────────────────────────
  /training-sessions/{id}/attendance:
    get:
      operationId: getSessionAttendance
      tags: [attendance]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"
    put:
      operationId: saveSessionAttendance
      tags: [attendance]
      summary: Save all attendance records for a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceSaveInput"
      responses:
        "200":
          description: Saved
