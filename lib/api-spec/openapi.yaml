          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /fleet/{id}/valuations:
    post:
      operationId: addFleetValuation
      tags: [fleet]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FleetValuationInput"
      responses:
        "201":
          description: Valuation added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetValuation"

  # ── Equipment ─────────────────────────────────────────────────────────────────
  /equipment:
    get:
      operationId: listEquipment
      tags: [equipment]
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: status
